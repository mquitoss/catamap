[project]
name = "catamap-data"
version = "0.1.0"
description = "Datasets reproducibles del entorno alimentario escolar de Barcelona"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
  "requests>=2.28,<3",
  "shapely>=2.1,<3",
  "pyproj>=3.6,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
